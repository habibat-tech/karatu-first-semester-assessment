
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALT School - Sign In</title>
</head>
<body>
    <header>
        <h1>ALT School Africa</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="form.html">Sign In</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section aria-labelledby="signin-heading">
            <h2 id="signin-heading">Welcome Back!</h2>
            <p>Sign in to your ALT School account.</p>

            <form action="#" method="post">
                <div>
                    <label for="email">Email Address:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="password">Password:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p>
                    <a href="https://portal.altschoolafrica.com/auth/signin">
                        Forgot your password?
                    </a>
                </p>

                <button type="submit">Sign In</button>
            </form>

            <p>
                Don't have an account?
                <a href="https://altschoolafrica.com/">
                    Learn more about ALT School
                </a>
            </p>
        </section>
    </main>

    <footer>
        <address>
            Contact:
            <a href="mailto:YOUR_EMAIL@example.com">
                habibatadams005@gmail.com
            </a>
        </address>

        <p>&copy; 2026 Habibat. All rights reserved.</p>
    </footer>
</body>
</html>
